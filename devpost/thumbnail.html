<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sprout Devpost Thumbnail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,800&family=Plus+Jakarta+Sans:wght@600;700;800&display=block" rel="stylesheet">
<style>
  :root {
    --ink: #141414; --sky: #8EC5FF; --sky-50: #DCEBFF; --grass: #5BD16A; --leaf: #3DDC5A;
    --sun: #FFC93C; --orange: #FF9F4A; --pink: #FF8FB1; --cream: #FFF6E5; --muted: #4A4A4A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1500px; height: 1000px; overflow: hidden; background: var(--sky); }
  body { font-family: "Plus Jakarta Sans", sans-serif; color: var(--ink); position: relative; }

  /* hills */
  .hills { position: absolute; left: 0; bottom: 0; width: 1500px; height: 300px; }

  /* left copy block */
  .copy { position: absolute; left: 88px; top: 92px; width: 760px; }
  .chip {
    display: inline-flex; align-items: center; gap: 12px;
    background: #fff; border: 4px solid var(--ink); border-radius: 999px;
    box-shadow: 5px 5px 0 var(--ink); padding: 12px 26px 12px 16px;
    font-weight: 800; font-size: 26px; letter-spacing: .01em;
  }
  .chip .dot { width: 22px; height: 22px; border-radius: 50%; background: var(--leaf); border: 4px solid var(--ink); }
  .wordmark {
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 800;
    font-size: 228px; line-height: .9; letter-spacing: -0.028em; margin-top: 34px;
    color: var(--ink);
  }
  .headline {
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 400;
    font-size: 66px; line-height: 1.08; letter-spacing: -0.02em; margin-top: 30px;
  }
  .headline b { font-weight: 800; }
  .headline .mark { background: var(--sun); border: 4px solid var(--ink); border-radius: 18px; padding: 0 14px; box-shadow: 5px 5px 0 var(--ink); display: inline-block; line-height: 1.02; margin-top: 10px; }

  /* right hero */
  .hero { position: absolute; right: 70px; top: 40px; width: 640px; height: 900px; }
  .burst { position: absolute; left: 110px; top: 100px; }
  .mascot { position: absolute; left: 150px; top: 150px; filter: drop-shadow(8px 8px 0 var(--ink)); }
  .coin { position: absolute; filter: drop-shadow(5px 5px 0 var(--ink)); }

  .card {
    position: absolute; background: #fff; border: 4px solid var(--ink); border-radius: 26px;
    box-shadow: 7px 7px 0 var(--ink);
  }
  .bubble { left: -40px; top: 40px; width: 320px; padding: 20px 24px; font-size: 27px; font-weight: 700; line-height: 1.25; transform: rotate(-4deg); }
  .bubble small { display: block; font-size: 18px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .bubble:after {
    content: ""; position: absolute; right: 46px; bottom: -22px; width: 34px; height: 34px;
    background: #fff; border-right: 4px solid var(--ink); border-bottom: 4px solid var(--ink);
    transform: rotate(45deg) skew(10deg, 10deg);
  }

  .approve { left: 190px; top: 650px; width: 440px; padding: 20px 22px; display: flex; align-items: center; gap: 18px; transform: rotate(3deg); background: var(--cream); }
  .approve .check {
    flex: none; width: 66px; height: 66px; border-radius: 50%; background: var(--leaf);
    border: 4px solid var(--ink); display: grid; place-items: center;
  }
  .approve .t1 { font-size: 18px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .approve .t2 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 34px; line-height: 1.05; margin-top: 2px; }

  .nospend {
    position: absolute; left: 88px; bottom: 74px;
    display: flex; gap: 18px;
  }
  .pill {
    background: #fff; border: 4px solid var(--ink); border-radius: 999px; box-shadow: 5px 5px 0 var(--ink);
    padding: 14px 28px; font-weight: 800; font-size: 27px;
  }
  .pill.ink { background: var(--ink); color: #fff; }
</style>
</head>
<body>

<svg class="hills" viewBox="0 0 1500 300" preserveAspectRatio="none" aria-hidden="true">
  <path d="M-20 170 C220 90 420 110 640 165 C860 220 1060 120 1300 110 C1400 106 1470 130 1520 150 L1520 320 L-20 320 Z" fill="#5BD16A" stroke="#141414" stroke-width="5"/>
  <path d="M-20 240 C260 190 520 230 760 250 C1000 270 1240 200 1520 215 L1520 320 L-20 320 Z" fill="#3DDC5A" stroke="#141414" stroke-width="5"/>
</svg>

<div class="copy">
  <div class="chip"><span class="dot"></span>AI money coach for kids 8–12</div>
  <h1 class="wordmark">Sprout</h1>
  <p class="headline">Allowance that <b>grows</b>.<br>A coach that <span class="mark"><b>can't spend</b></span>.</p>
</div>

<div class="nospend">
  <span class="pill">Save</span>
  <span class="pill">Ask the coach</span>
  <span class="pill ink">Parent approves → PayPal</span>
</div>

<div class="hero">
  <svg class="burst" width="440" height="440" viewBox="0 0 220 220" aria-hidden="true">
    <g stroke="#141414" stroke-width="6" stroke-linecap="round">
      <path d="M110 6 V28"/><path d="M40 34 L56 50"/><path d="M180 34 L164 50"/>
      <path d="M6 104 H28"/><path d="M214 104 H192"/>
    </g>
  </svg>

  <!-- Mascot (stage 5, happy) ported from resources/js/components/sprout/mascot.tsx -->
  <svg class="mascot" width="360" height="432" viewBox="0 0 200 240" aria-hidden="true">
    <g transform="translate(0 20)">
      <path d="M100 72 L100 30" stroke="#141414" stroke-width="6" stroke-linecap="round"/>
      <path d="M100 52 C82 28 54 28 44 42 C58 60 86 62 100 52 Z" fill="#3DDC5A" stroke="#141414" stroke-width="5" stroke-linejoin="round"/>
      <path d="M100 46 C116 18 150 16 160 32 C146 52 118 56 100 46 Z" fill="#3DDC5A" stroke="#141414" stroke-width="5" stroke-linejoin="round"/>
      <path d="M100 36 C86 18 66 16 58 24 C68 38 88 42 100 36 Z" fill="#9BEA7A" stroke="#141414" stroke-width="5" stroke-linejoin="round"/>
      <circle cx="100" cy="14" r="12" fill="#FF8FB1" stroke="#141414" stroke-width="5"/>
      <circle cx="100" cy="14" r="4" fill="#FFC93C"/>
      <path d="M100 68 C150 68 178 106 178 148 C178 192 146 214 100 214 C54 214 22 192 22 148 C22 106 50 68 100 68 Z" fill="#FFC93C" stroke="#141414" stroke-width="5"/>
      <path d="M58 100 C66 88 80 81 94 80" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.75"/>
      <circle cx="76" cy="136" r="17" fill="#FFFFFF" stroke="#141414" stroke-width="4"/>
      <circle cx="79" cy="139" r="9" fill="#141414"/>
      <circle cx="83" cy="134" r="3.5" fill="#FFFFFF"/>
      <circle cx="124" cy="136" r="17" fill="#FFFFFF" stroke="#141414" stroke-width="4"/>
      <circle cx="127" cy="139" r="9" fill="#141414"/>
      <circle cx="131" cy="134" r="3.5" fill="#FFFFFF"/>
      <ellipse cx="56" cy="164" rx="11" ry="7" fill="#FF8FB1"/>
      <ellipse cx="144" cy="164" rx="11" ry="7" fill="#FF8FB1"/>
      <path d="M86 162 Q100 184 114 162 Q100 168 86 162 Z" fill="#141414" stroke="#141414" stroke-width="3" stroke-linejoin="round"/>
    </g>
  </svg>

  <svg class="coin" style="left:520px; top:250px" width="96" height="96" viewBox="0 0 44 44" aria-hidden="true">
    <circle cx="22" cy="22" r="19" fill="#FFC93C" stroke="#141414" stroke-width="3"/>
    <text x="22" y="29.5" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="20" fill="#141414">$</text>
  </svg>
  <svg class="coin" style="left:90px; top:560px" width="74" height="74" viewBox="0 0 44 44" aria-hidden="true">
    <circle cx="22" cy="22" r="19" fill="#FFC93C" stroke="#141414" stroke-width="3"/>
    <text x="22" y="29.5" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="20" fill="#141414">$</text>
  </svg>
  <svg class="coin" style="left:560px; top:470px" width="60" height="60" viewBox="0 0 44 44" aria-hidden="true">
    <circle cx="22" cy="22" r="19" fill="#FFC93C" stroke="#141414" stroke-width="3"/>
    <text x="22" y="29.5" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="20" fill="#141414">$</text>
  </svg>

  <div class="card bubble"><small>Sprout coach</small>Save 3 more weeks, or ask a parent?</div>

  <div class="card approve">
    <div class="check">
      <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5 L9.5 18 L20 6.5" fill="none" stroke="#141414" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div>
      <div class="t1">Purchase request</div>
      <div class="t2">Parent approved</div>
    </div>
  </div>
</div>

</body>
</html>
